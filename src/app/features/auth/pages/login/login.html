<div class="relative min-h-screen w-full flex flex-col items-center justify-center p-4 sm:p-6 bg-[#080c14] text-slate-100 overflow-hidden font-sans select-none">


  <!-- Decorative Grid Overlay -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#ffffff05_1px,transparent_1px),linear-gradient(to_bottom,#ffffff05_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>
  <!-- Animated Wifi / Signal Waves (Centré derrière le formulaire) -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center">
    <div class="relative w-[650px] h-[650px] sm:w-[850px] sm:h-[850px] md:w-[1000px] md:h-[1000px] flex items-center justify-center">
      <!-- Wave Center Signal Glow / Node -->
      <div class="absolute w-40 h-40 rounded-full bg-indigo-600/20 blur-2xl animate-pulse"></div>
      <div class="absolute w-6 h-6 rounded-full bg-indigo-500/80 shadow-[0_0_25px_#6366f1] animate-ping"></div>

      <!-- Concentric Radiating Waves -->
      <div class="absolute inset-0 rounded-full border border-indigo-500/50 shadow-[0_0_15px_rgba(99,102,241,0.2)] animate-wifiPulse"></div>
      <div class="absolute inset-0 rounded-full border border-purple-500/50 shadow-[0_0_15px_rgba(168,85,247,0.2)] animate-wifiPulse [animation-delay:1.5s]"></div>
      <div class="absolute inset-0 rounded-full border border-amber-400/40 shadow-[0_0_15px_rgba(251,191,36,0.2)] animate-wifiPulse [animation-delay:3s]"></div>
      <div class="absolute inset-0 rounded-full border border-indigo-400/40 shadow-[0_0_15px_rgba(129,140,248,0.2)] animate-wifiPulse [animation-delay:4.5s]"></div>
    </div>
  </div>


  <!-- Floating Fashion Background Animated Icons -->
  <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
    <!-- Sewing Machine -->
    <div class="absolute top-[12%] left-[8%] text-indigo-400/15 text-6xl md:text-7xl animate-floatSlow">
      <i class="ti ti-sewing-machine"></i>
    </div>

    <!-- Scissors -->
    <div class="absolute bottom-[15%] left-[10%] text-amber-400/15 text-5xl md:text-6xl animate-floatReverse">
      <i class="ti ti-scissors"></i>
    </div>

    <!-- Hanger / Mannequin -->
    <div class="absolute top-[15%] right-[10%] text-purple-400/15 text-6xl md:text-7xl animate-floatSlow [animation-delay:2s]">
      <i class="ti ti-hanger"></i>
    </div>

    <!-- Shirt / Dress Model -->
    <div class="absolute bottom-[18%] right-[8%] text-emerald-400/15 text-6xl md:text-7xl animate-floatReverse [animation-delay:1s]">
      <i class="ti ti-shirt"></i>
    </div>
  </div>

  <!-- Single Centered Login Card -->
  <div class="relative z-10 w-full max-w-md overflow-hidden rounded-3xl border border-white/10 bg-slate-900/85 p-6 sm:p-8 md:p-10 shadow-[0_20px_50px_rgba(0,0,0,0.8)] backdrop-blur-2xl space-y-6 animate-scaleUp">
    
    <!-- Brand Logo Header -->
    <div class="flex flex-col items-center text-center space-y-3">
      <div class="flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-amber-400 via-indigo-600 to-purple-600 text-white shadow-lg shadow-indigo-600/30">
        <i class="ti ti-scissors text-3xl"></i>
      </div>

      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white font-heading">
          DigitCouture
        </h1>
        <span class="inline-block mt-1 text-[11px] font-semibold text-indigo-400 uppercase tracking-widest bg-indigo-500/10 px-3.5 py-1 rounded-full border border-indigo-500/20">
          Super Admin Console
        </span>
      </div>
    </div>

    <!-- Subtitle -->
    <p class="text-center text-xs text-slate-400 leading-relaxed px-2">
      Entrez vos identifiants administrateur pour accéder au panneau de gestion des souscriptions.
    </p>

    <!-- Error Alert Message -->
    @if (errorMessage()) {
      <div class="flex items-start gap-3 rounded-2xl bg-rose-500/10 p-3.5 border border-rose-500/30 text-rose-300 text-xs animate-fadeIn">
        <i class="ti ti-alert-triangle text-lg text-rose-400 flex-shrink-0 mt-0.5"></i>
        <div class="flex-1">
          <p class="font-semibold text-rose-200">Accès Refusé</p>
          <p class="text-rose-300/90 mt-0.5 leading-normal">{{ errorMessage() }}</p>
        </div>
      </div>
    }

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <app-input
        formControlName="username"
        label="Identifiant"
        placeholder="Ex: 3992602864245"
        iconLeft="ti ti-user"
        [required]="true"
        [errorMessage]="loginForm.get('username')?.touched && loginForm.get('username')?.errors?.['required'] ? 'L\'identifiant est obligatoire' : null"
      ></app-input>

      <app-input
        formControlName="password"
        type="password"
        label="Mot de passe"
        placeholder="••••••••"
        iconLeft="ti ti-lock"
        [required]="true"
        [errorMessage]="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required'] ? 'Le mot de passe est obligatoire' : null"
      ></app-input>

      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 text-slate-400 cursor-pointer select-none">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="h-4 w-4 rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-indigo-500"
          />
          <span>Mémoriser</span>
        </label>

        <button
          type="button"
          (click)="goToForgotPassword()"
          class="font-medium text-amber-400 hover:text-amber-300 transition-colors bg-transparent border-none cursor-pointer p-0"
        >
          Mot de passe oublié ?
        </button>
      </div>

      <!-- Centered Submit Button Container -->
      <div class="flex justify-center pt-2">
        <app-button
          type="submit"
          variant="primary"
          size="lg"
          [loading]="isLoading()"
          iconRight="ti ti-arrow-right"
        >
          Se connecter
        </app-button>
      </div>
    </form>

    <!-- Footer Copyright -->
    <div class="pt-4 border-t border-white/5 text-center">
      <p class="text-[11px] text-slate-500">
        &copy; 2026 DigitCouture. Tous droits réservés.
      </p>
    </div>
  </div>
</div>
