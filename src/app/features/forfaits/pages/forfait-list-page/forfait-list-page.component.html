<app-page-header
  title="Catalogue des Forfaits"
  subtitle="Administration des offres, prix mensuels/annuels et quotas d'ateliers"
  icon="ti ti-box"
  [breadcrumbs]="[
    { label: 'Accueil', url: '/dashboard' },
    { label: 'Forfaits', active: true }
  ]"
></app-page-header>

<div class="space-y-6">
  <app-card variant="default">
    <!-- Top Toolbar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 border-b border-slate-100">
      <div class="w-full sm:w-80">
        <app-search
          placeholder="Rechercher un forfait, tarif, option..."
          (search)="onSearch($event)"
        ></app-search>
      </div>

      <app-button
        type="button"
        variant="primary"
        iconLeft="ti ti-plus"
        (btnClick)="onOpenCreateForm()"
      >
        Nouveau Forfait
      </app-button>
    </div>

    <!-- Content Table / Loader -->
    <div class="p-4">
      @if (isLoading()) {
        <div class="py-12 flex justify-center items-center">
          <app-loader size="lg" text="Chargement des forfaits..."></app-loader>
        </div>
      } @else {
        <app-forfait-table
          [items]="filteredForfaits()"
          (view)="onViewDetails($event)"
          (edit)="onOpenEditForm($event)"
          (delete)="onDelete($event)"
        ></app-forfait-table>
      }
    </div>

    <!-- Pagination -->
    @if (!isLoading() && totalItems() > 0) {
      <div class="p-4 border-t border-slate-100 flex items-center justify-between">
        <div class="text-xs text-slate-500 font-medium">
          Total : <span class="font-bold text-slate-900">{{ totalItems() }}</span> forfait(s)
        </div>

        <app-pagination
          [currentPage]="currentPage()"
          [totalItems]="totalItems()"
          [pageSize]="limit()"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
    }
  </app-card>
</div>

<!-- Modals -->
<app-forfait-form
  [isOpen]="isFormOpen()"
  [forfait]="selectedForfait()"
  [loading]="isSaving()"
  (save)="onSaveForfait($event)"
  (cancel)="isFormOpen.set(false)"
></app-forfait-form>

<app-forfait-detail-modal
  [isOpen]="isDetailOpen()"
  [item]="selectedForfait()"
  (close)="isDetailOpen.set(false)"
></app-forfait-detail-modal>
