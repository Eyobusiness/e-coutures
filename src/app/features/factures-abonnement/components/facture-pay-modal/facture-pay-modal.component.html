@if (isOpen() && facture(); as item) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in"
    role="dialog"
    aria-modal="true"
    (click)="onBackdropClick($event)"
  >
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100 animate-scale-up space-y-6">
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-lg">
            <i class="ti ti-cash"></i>
          </div>
          <div>
            <h2 class="text-lg font-bold text-slate-900">
              Enregistrer le Paiement
            </h2>
            <p class="text-xs text-slate-500 font-semibold">
              Montant : {{ item.montant }} {{ item.devise || 'XOF' }}
            </p>
          </div>
        </div>

        <button
          type="button"
          class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg transition-colors cursor-pointer"
          (click)="cancel.emit()"
        >
          <i class="ti ti-x text-lg"></i>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <app-select
          formControlName="moyenPaiement"
          label="Moyen de Paiement"
          [options]="moyenPaiementOptions"
          placeholder="Sélectionner le moyen de paiement..."
          [required]="true"
        ></app-select>

        <app-input
          formControlName="refTransaction"
          label="Référence de Transaction"
          placeholder="Ex: REF-8823901"
          iconLeft="ti ti-hash"
          [required]="true"
        ></app-input>

        <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
          <app-button
            type="button"
            variant="ghost"
            (btnClick)="cancel.emit()"
          >
            Annuler
          </app-button>

          <app-button
            type="submit"
            variant="accent"
            iconLeft="ti ti-check"
            [loading]="loading()"
          >
            Valider le Règlement
          </app-button>
        </div>
      </form>
    </div>
  </div>
}
