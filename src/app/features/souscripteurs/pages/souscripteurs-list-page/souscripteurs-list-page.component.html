<app-page-header
  title="Gestion des Souscripteurs"
  subtitle="Comptes payeurs et propriétaires d'ateliers SaaS (statuts, coordonnées, abonnements)"
  icon="ti ti-users-group"
  [breadcrumbs]="[
    { label: 'Accueil', url: '/dashboard' },
    { label: 'Souscripteurs', active: true }
  ]"
></app-page-header>

<div class="space-y-6">
  <app-card variant="default">
    <!-- Top Toolbar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 border-b border-slate-100">
      <div class="w-full sm:w-80">
        <app-search
          placeholder="Rechercher par nom, email, téléphone..."
          (search)="onSearch($event)"
        ></app-search>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <app-button
          type="button"
          variant="secondary"
          iconLeft="ti ti-user-plus"
          (btnClick)="onOpenEnrollmentModal()"
        >
          Enrôler un Client (Express)
        </app-button>

        <app-button
          type="button"
          variant="primary"
          iconLeft="ti ti-plus"
          (btnClick)="onOpenCreateForm()"
        >
          Nouveau Souscripteur
        </app-button>
      </div>
    </div>

    <!-- Content Table / Loader -->
    <div class="p-4">
      @if (isLoading()) {
        <div class="py-12 flex justify-center items-center">
          <app-loader size="lg" text="Chargement des souscripteurs..."></app-loader>
        </div>
      } @else {
        <app-souscripteur-table
          [items]="filteredSouscripteurs()"
          (view)="onViewDetails($event)"
          (edit)="onOpenEditForm($event)"
          (link)="onOpenLinkModal($event)"
          (delete)="onDelete($event)"
        ></app-souscripteur-table>
      }
    </div>

    <!-- Pagination -->
    @if (!isLoading() && totalItems() > 0) {
      <div class="p-4 border-t border-slate-100 flex items-center justify-between">
        <div class="text-xs text-slate-500 font-medium">
          Total : <span class="font-bold text-slate-900">{{ totalItems() }}</span> souscripteur(s)
        </div>

        <app-pagination
          [currentPage]="currentPage()"
          [totalItems]="totalItems()"
          [pageSize]="limit()"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
    }
  </app-card>
</div>

<!-- Modals -->
<app-enrollment-form
  [isOpen]="isEnrollmentModalOpen()"
  (close)="isEnrollmentModalOpen.set(false)"
  (enrolled)="onEnrollmentSuccess()"
></app-enrollment-form>

<app-souscripteur-form
  [isOpen]="isFormOpen()"
  [souscripteur]="selectedSouscripteur()"
  [loading]="isSaving()"
  (save)="onSaveSouscripteur($event)"
  (cancel)="isFormOpen.set(false)"
></app-souscripteur-form>

<app-link-subscription-modal
  [isOpen]="isLinkOpen()"
  mode="link-abonnement"
  [souscripteur]="selectedSouscripteur()"
  [abonnements]="abonnements()"
  [loading]="isSaving()"
  (submitLink)="onConfirmLink($event)"
  (cancel)="isLinkOpen.set(false)"
></app-link-subscription-modal>

<app-souscripteur-detail-modal
  [isOpen]="isDetailOpen()"
  [item]="selectedSouscripteur()"
  (close)="isDetailOpen.set(false)"
></app-souscripteur-detail-modal>
