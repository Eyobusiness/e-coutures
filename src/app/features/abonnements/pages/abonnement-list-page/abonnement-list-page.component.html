<app-page-header
  title="Gestion des Abonnements"
  subtitle="Souscriptions des souscripteurs aux formules de forfaits (durées, statuts et renouvellement)"
  icon="ti ti-bulb-filled"
  [breadcrumbs]="[
    { label: 'Accueil', url: '/dashboard' },
    { label: 'Abonnements', active: true }
  ]"
></app-page-header>

<div class="space-y-6">
  <app-card variant="default">
    <!-- Top Toolbar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 border-b border-slate-100">
      <div class="w-full sm:w-80">
        <app-search
          placeholder="Rechercher par souscripteur, forfait, statut..."
          (search)="onSearch($event)"
        ></app-search>
      </div>

      <app-button
        type="button"
        variant="primary"
        iconLeft="ti ti-plus"
        (btnClick)="onOpenCreateForm()"
      >
        Nouvel Abonnement
      </app-button>
    </div>

    <!-- Content Table / Loader -->
    <div class="p-4">
      @if (isLoading()) {
        <div class="py-12 flex justify-center items-center">
          <app-loader size="lg" text="Chargement des abonnements..."></app-loader>
        </div>
      } @else {
        <app-abonnement-table
          [items]="filteredAbonnements()"
          (view)="onViewDetails($event)"
          (edit)="onOpenEditForm($event)"
          (delete)="onDelete($event)"
        ></app-abonnement-table>
      }
    </div>

    <!-- Pagination -->
    @if (!isLoading() && totalItems() > 0) {
      <div class="p-4 border-t border-slate-100 flex items-center justify-between">
        <div class="text-xs text-slate-500 font-medium">
          Total : <span class="font-bold text-slate-900">{{ totalItems() }}</span> abonnement(s)
        </div>

        <app-pagination
          [currentPage]="currentPage()"
          [totalItems]="totalItems()"
          [pageSize]="limit()"
          (pageChange)="onPageChange($event)"
        ></app-pagination>
      </div>
    }
  </app-card>
</div>

<!-- Modals -->
<app-abonnement-form
  [isOpen]="isFormOpen()"
  [abonnement]="selectedAbonnement()"
  [souscripteurs]="souscripteurs()"
  [forfaits]="forfaits()"
  [loading]="isSaving()"
  (save)="onSaveAbonnement($event)"
  (cancel)="isFormOpen.set(false)"
></app-abonnement-form>

<app-abonnement-detail-modal
  [isOpen]="isDetailOpen()"
  [item]="selectedAbonnement()"
  (close)="isDetailOpen.set(false)"
></app-abonnement-detail-modal>
