<div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
  <div class="space-y-1">
    @if (breadcrumbs().length > 0) {
      <div class="mb-2">
        <app-breadcrumb [items]="breadcrumbs()"></app-breadcrumb>
      </div>
    }

    <div class="flex items-center gap-3">
      @if (icon()) {
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-indigo-600 text-white shadow-md shadow-indigo-600/20">
          <i [class]="icon() + ' text-2xl'"></i>
        </div>
      }

      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 md:text-3xl">
          {{ title() }}
        </h1>

        @if (badgeText()) {
          <app-badge variant="primary" size="md">{{ badgeText() }}</app-badge>
        }
      </div>
    </div>

    @if (subtitle()) {
      <p class="text-sm text-slate-500 max-w-3xl leading-relaxed">
        {{ subtitle() }}
      </p>
    }
  </div>

  <div class="flex flex-wrap items-center gap-3 self-start md:self-auto">
    <ng-content select="[header-actions]"></ng-content>
  </div>
</div>
