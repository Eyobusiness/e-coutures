@if (isOpen()) {
  <div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 sm:p-6 overflow-y-auto animate-fadeIn">
    <!-- Backdrop -->
    <div
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
      (click)="onBackdropClick()"
      aria-hidden="true"
    ></div>

    <!-- Modal Dialog Window -->
    <div
      class="relative flex flex-col w-full transform overflow-hidden rounded-2xl bg-white shadow-2xl transition-all border border-slate-100 z-10 max-h-[90vh] animate-scaleUp"
      [class.max-w-sm]="size() === 'sm'"
      [class.max-w-md]="size() === 'md'"
      [class.max-w-xl]="size() === 'lg'"
      [class.max-w-3xl]="size() === 'xl'"
      [class.max-w-full]="size() === 'full'"
      [class.m-4]="size() === 'full'"
      role="dialog"
      aria-modal="true"
    >
      <!-- Header -->
      @if (title() || showCloseButton()) {
        <div class="flex items-center justify-between p-5 border-b border-slate-100 bg-slate-50/50">
          <div>
            @if (title()) {
              <h3 class="text-lg font-semibold text-slate-900 tracking-tight">
                {{ title() }}
              </h3>
            }
            @if (subtitle()) {
              <p class="text-xs text-slate-500 mt-0.5">
                {{ subtitle() }}
              </p>
            }
          </div>

          <div class="flex items-center gap-2">
            <ng-content select="[modal-header-actions]"></ng-content>

            @if (showCloseButton()) {
              <button
                type="button"
                (click)="onCloseClick()"
                class="flex h-8 w-8 items-center justify-center rounded-xl text-slate-400 hover:bg-slate-200/60 hover:text-slate-700 transition-colors focus:outline-none"
                aria-label="Fermer la fenêtre modale"
              >
                <i class="ti ti-x text-lg"></i>
              </button>
            }
          </div>
        </div>
      }

      <!-- Body Content -->
      <div class="flex-1 overflow-y-auto p-6">
        <ng-content></ng-content>
      </div>

      <!-- Footer (slot projected) -->
      <div class="p-4 border-t border-slate-100 bg-slate-50/50 empty:hidden">
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
