<div class="relative overflow-hidden rounded-2xl bg-white p-6 border border-slate-200/80 shadow-xs transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 group">
  <!-- Soft background glow decoration -->
  <div
    class="absolute -right-6 -top-6 h-24 w-24 rounded-full opacity-10 blur-xl transition-all group-hover:scale-125"
    [class.bg-indigo-600]="color() === 'primary'"
    [class.bg-purple-600]="color() === 'purple' || color() === 'secondary'"
    [class.bg-emerald-600]="color() === 'success'"
    [class.bg-amber-600]="color() === 'warning'"
    [class.bg-rose-600]="color() === 'danger'"
    [class.bg-sky-600]="color() === 'info'"
  ></div>

  <div class="flex items-start justify-between gap-4">
    <div class="space-y-1">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-500">
        {{ title() }}
      </p>
      <h3 class="text-2xl font-bold tracking-tight text-slate-900 md:text-3xl">
        {{ value() }}
      </h3>
    </div>

    <div
      class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-2xl transition-transform duration-300 group-hover:scale-110 shadow-xs"
      [class.bg-indigo-50]="color() === 'primary'"
      [class.text-indigo-600]="color() === 'primary'"
      [class.bg-purple-50]="color() === 'purple' || color() === 'secondary'"
      [class.text-purple-600]="color() === 'purple' || color() === 'secondary'"
      [class.bg-emerald-50]="color() === 'success'"
      [class.text-emerald-600]="color() === 'success'"
      [class.bg-amber-50]="color() === 'warning'"
      [class.text-amber-600]="color() === 'warning'"
      [class.bg-rose-50]="color() === 'danger'"
      [class.text-rose-600]="color() === 'danger'"
      [class.bg-sky-50]="color() === 'info'"
      [class.text-sky-600]="color() === 'info'"
    >
      <i [class]="icon() + ' text-2xl'"></i>
    </div>
  </div>

  <div class="mt-4 flex items-center justify-between text-xs pt-3 border-t border-slate-100">
    @if (trend() !== null) {
      <div class="flex items-center gap-1.5">
        <span
          class="inline-flex items-center gap-0.5 rounded-full px-2 py-0.5 font-semibold text-[11px]"
          [class.bg-emerald-50]="trend()! >= 0"
          [class.text-emerald-700]="trend()! >= 0"
          [class.bg-rose-50]="trend()! < 0"
          [class.text-rose-700]="trend()! < 0"
        >
          <i [class]="trend()! >= 0 ? 'ti ti-trending-up' : 'ti ti-trending-down'"></i>
          <span>{{ trend()! >= 0 ? '+' : '' }}{{ trend() }}%</span>
        </span>

        @if (trendLabel()) {
          <span class="text-slate-400 font-medium">{{ trendLabel() }}</span>
        }
      </div>
    } @else if (subtitle()) {
      <span class="text-slate-500 font-medium">{{ subtitle() }}</span>
    }
  </div>
</div>
