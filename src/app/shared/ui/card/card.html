<div
  class="relative rounded-2xl transition-all duration-300 overflow-hidden"
  [class.p-6]="padded()"
  [class.p-0]="!padded()"
  [class.border]="bordered()"
  [class.border-slate-200/80]="bordered() && variant() === 'default'"
  [class.border-white/20]="bordered() && variant() === 'glass'"
  [class.border-indigo-100]="bordered() && variant() === 'primary'"
  [class.shadow-none]="shadow() === 'none'"
  [class.shadow-sm]="shadow() === 'sm'"
  [class.shadow-md]="shadow() === 'md'"
  [class.shadow-lg]="shadow() === 'lg'"
  [class.hover:-translate-y-1]="hoverable()"
  [class.hover:shadow-xl]="hoverable()"
  [class.bg-white]="variant() === 'default'"
  [class.bg-white/70]="variant() === 'glass'"
  [class.backdrop-blur-md]="variant() === 'glass'"
  [class.bg-gradient-to-br]="variant() === 'gradient' || variant() === 'primary'"
  [class.from-indigo-50]="variant() === 'primary'"
  [class.to-white]="variant() === 'primary'"
  [class.from-slate-900]="variant() === 'gradient'"
  [class.to-indigo-950]="variant() === 'gradient'"
  [class.text-white]="variant() === 'gradient'"
>
  @if (title() || icon()) {
    <div class="flex items-center justify-between gap-4 mb-4 pb-3 border-b border-slate-100" [class.border-white/10]="variant() === 'gradient'">
      <div class="flex items-center gap-3">
        @if (icon()) {
          <div
            class="flex items-center justify-center w-10 h-10 rounded-xl"
            [class.bg-indigo-100]="variant() !== 'gradient'"
            [class.text-indigo-600]="variant() !== 'gradient'"
            [class.bg-white/10]="variant() === 'gradient'"
            [class.text-indigo-300]="variant() === 'gradient'"
          >
            <i [class]="icon() + ' text-xl'"></i>
          </div>
        }
        <div>
          @if (title()) {
            <h3 class="text-base font-semibold tracking-tight" [class.text-slate-900]="variant() !== 'gradient'" [class.text-white]="variant() === 'gradient'">
              {{ title() }}
            </h3>
          }
          @if (subtitle()) {
            <p class="text-xs" [class.text-slate-500]="variant() !== 'gradient'" [class.text-slate-300]="variant() === 'gradient'">
              {{ subtitle() }}
            </p>
          }
        </div>
      </div>
      <div class="flex items-center gap-2">
        <ng-content select="[card-header-actions]"></ng-content>
      </div>
    </div>
  }

  <div class="relative">
    <ng-content></ng-content>
  </div>

  <div class="mt-4 pt-3 empty:hidden border-t border-slate-100" [class.border-white/10]="variant() === 'gradient'">
    <ng-content select="[card-footer]"></ng-content>
  </div>
</div>
