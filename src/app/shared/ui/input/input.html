<div class="space-y-1.5">
  @if (label()) {
    <label [for]="id()" class="block text-sm font-medium text-slate-700">
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 ml-0.5">*</span>
      }
    </label>
  }

  <div class="relative rounded-xl shadow-xs">
    @if (iconLeft()) {
      <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
        <i [class]="iconLeft() + ' text-lg'"></i>
      </div>
    }

    <input
      [id]="id()"
      [type]="type() === 'password' && showPassword() ? 'text' : type()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled() || isDisabled()"
      [readonly]="readonly()"
      [required]="required()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="block w-full rounded-xl border bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-offset-0 disabled:bg-slate-50 disabled:text-slate-500 disabled:cursor-not-allowed transition-colors"
      [class.pl-10]="iconLeft()"
      [class.pr-10]="iconRight() || type() === 'password'"
      [class.border-slate-300]="!errorMessage()"
      [class.focus:border-indigo-600]="!errorMessage()"
      [class.focus:ring-indigo-600/20]="!errorMessage()"
      [class.border-rose-500]="errorMessage()"
      [class.focus:border-rose-500]="errorMessage()"
      [class.focus:ring-rose-500/20]="errorMessage()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        (click)="togglePasswordVisibility()"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 transition-colors"
        aria-label="Afficher ou masquer le mot de passe"
      >
        <i [class]="showPassword() ? 'ti ti-eye-off text-lg' : 'ti ti-eye text-lg'"></i>
      </button>
    } @else if (iconRight()) {
      <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400">
        <i [class]="iconRight() + ' text-lg'"></i>
      </div>
    }
  </div>

  @if (errorMessage()) {
    <p class="text-xs text-rose-600 flex items-center gap-1 mt-1">
      <i class="ti ti-alert-circle"></i>
      <span>{{ errorMessage() }}</span>
    </p>
  } @else if (hint()) {
    <p class="text-xs text-slate-500 mt-1">
      {{ hint() }}
    </p>
  }
</div>
