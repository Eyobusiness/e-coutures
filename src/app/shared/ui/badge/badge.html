<span
  class="inline-flex items-center gap-1.5 font-medium transition-all duration-150"
  [class.rounded-full]="rounded()"
  [class.rounded-md]="!rounded()"
  [class.text-xs]="size() === 'sm' || size() === 'md'"
  [class.px-2]="size() === 'sm'"
  [class.py-0.5]="size() === 'sm'"
  [class.px-2.5]="size() === 'md'"
  [class.py-1]="size() === 'md'"
  [class.text-sm]="size() === 'lg'"
  [class.px-3]="size() === 'lg'"
  [class.py-1.5]="size() === 'lg'"
  [class.bg-indigo-50]="variant() === 'primary'"
  [class.text-indigo-700]="variant() === 'primary'"
  [class.ring-1]="true"
  [class.ring-inset]="true"
  [class.ring-indigo-700/10]="variant() === 'primary'"
  [class.bg-purple-50]="variant() === 'secondary'"
  [class.text-purple-700]="variant() === 'secondary'"
  [class.ring-purple-700/10]="variant() === 'secondary'"
  [class.bg-emerald-50]="variant() === 'success'"
  [class.text-emerald-700]="variant() === 'success'"
  [class.ring-emerald-600/20]="variant() === 'success'"
  [class.bg-amber-50]="variant() === 'warning'"
  [class.text-amber-800]="variant() === 'warning'"
  [class.ring-amber-600/20]="variant() === 'warning'"
  [class.bg-rose-50]="variant() === 'danger'"
  [class.text-rose-700]="variant() === 'danger'"
  [class.ring-rose-600/10]="variant() === 'danger'"
  [class.bg-sky-50]="variant() === 'info'"
  [class.text-sky-700]="variant() === 'info'"
  [class.ring-sky-600/10]="variant() === 'info'"
  [class.bg-slate-100]="variant() === 'neutral'"
  [class.text-slate-600]="variant() === 'neutral'"
  [class.ring-slate-500/10]="variant() === 'neutral'"
  [class.bg-slate-900]="variant() === 'dark'"
  [class.text-slate-100]="variant() === 'dark'"
  [class.ring-slate-800]="variant() === 'dark'"
>
  @if (dot()) {
    <span
      class="h-1.5 w-1.5 rounded-full"
      [class.bg-indigo-500]="variant() === 'primary'"
      [class.bg-purple-500]="variant() === 'secondary'"
      [class.bg-emerald-500]="variant() === 'success'"
      [class.bg-amber-500]="variant() === 'warning'"
      [class.bg-rose-500]="variant() === 'danger'"
      [class.bg-sky-500]="variant() === 'info'"
      [class.bg-slate-400]="variant() === 'neutral'"
      [class.bg-emerald-400]="variant() === 'dark'"
    ></span>
  }

  @if (icon()) {
    <i [class]="icon()"></i>
  }

  <ng-content></ng-content>

  @if (removable()) {
    <button
      type="button"
      (click)="onRemove($event)"
      class="ml-0.5 inline-flex h-3.5 w-3.5 flex-shrink-0 items-center justify-center rounded-full hover:bg-black/10 focus:outline-none"
      aria-label="Supprimer le badge"
    >
      <i class="ti ti-x text-xs"></i>
    </button>
  }
</span>
