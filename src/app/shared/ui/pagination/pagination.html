<div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between px-4 py-3 bg-white rounded-2xl border border-slate-200/80 shadow-xs">
  <div class="flex items-center gap-4 text-xs text-slate-500 font-medium">
    <span>
      Affichage de <strong class="text-slate-900 font-semibold">{{ startItem() }}</strong> à <strong class="text-slate-900 font-semibold">{{ endItem() }}</strong> sur <strong class="text-slate-900 font-semibold">{{ totalItems() }}</strong> éléments
    </span>

    @if (showPageSize()) {
      <div class="flex items-center gap-2">
        <label for="pageSizeSelect" class="text-slate-500">Par page :</label>
        <select
          id="pageSizeSelect"
          [value]="pageSize()"
          (change)="onPageSizeSelect($event)"
          class="rounded-lg border border-slate-300 bg-white py-1 px-2 text-xs font-semibold text-slate-700 focus:border-indigo-600 focus:outline-none"
        >
          @for (option of pageSizeOptions(); track option) {
            <option [value]="option">{{ option }}</option>
          }
        </select>
      </div>
    }
  </div>

  <nav class="flex items-center gap-1 self-center sm:self-auto" aria-label="Pagination">
    <!-- Prev -->
    <button
      type="button"
      [disabled]="currentPage() === 1"
      (click)="setPage(currentPage() - 1)"
      class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
      aria-label="Page précédente"
    >
      <i class="ti ti-chevron-left text-sm"></i>
    </button>

    <!-- Page Buttons -->
    @for (page of visiblePages(); track $index) {
      @if (page === '...') {
        <span class="inline-flex h-8 w-8 items-center justify-center text-slate-400 text-xs">...</span>
      } @else {
        <button
          type="button"
          (click)="setPage(page)"
          class="inline-flex h-8 w-8 items-center justify-center rounded-lg text-xs font-semibold transition-all"
          [class.bg-indigo-600]="page === currentPage()"
          [class.text-white]="page === currentPage()"
          [class.shadow-xs]="page === currentPage()"
          [class.border]="page !== currentPage()"
          [class.border-slate-200]="page !== currentPage()"
          [class.bg-white]="page !== currentPage()"
          [class.text-slate-700]="page !== currentPage()"
          [class.hover:bg-slate-50]="page !== currentPage()"
        >
          {{ page }}
        </button>
      }
    }

    <!-- Next -->
    <button
      type="button"
      [disabled]="currentPage() === totalPages()"
      (click)="setPage(currentPage() + 1)"
      class="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-300 bg-white text-slate-600 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
      aria-label="Page suivante"
    >
      <i class="ti ti-chevron-right text-sm"></i>
    </button>
  </nav>
</div>
