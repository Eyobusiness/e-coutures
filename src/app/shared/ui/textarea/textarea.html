<div class="space-y-1.5">
  <div class="flex items-center justify-between">
    @if (label()) {
      <label [for]="id()" class="block text-sm font-medium text-slate-700">
        {{ label() }}
        @if (required()) {
          <span class="text-rose-500 ml-0.5">*</span>
        }
      </label>
    }

    @if (showCount() && maxLength()) {
      <span class="text-xs text-slate-400">
        {{ value().length }} / {{ maxLength() }}
      </span>
    }
  </div>

  <div class="relative rounded-xl shadow-xs">
    <textarea
      [id]="id()"
      [rows]="rows()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled() || isDisabled()"
      [readonly]="readonly()"
      [required]="required()"
      [attr.maxlength]="maxLength()"
      (input)="onInput($event)"
      (blur)="onBlur()"
      class="block w-full rounded-xl border bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-offset-0 disabled:bg-slate-50 disabled:text-slate-500 disabled:cursor-not-allowed transition-colors resize-y min-h-[80px]"
      [class.border-slate-300]="!errorMessage()"
      [class.focus:border-indigo-600]="!errorMessage()"
      [class.focus:ring-indigo-600/20]="!errorMessage()"
      [class.border-rose-500]="errorMessage()"
      [class.focus:border-rose-500]="errorMessage()"
      [class.focus:ring-rose-500/20]="errorMessage()"
    ></textarea>
  </div>

  @if (errorMessage()) {
    <p class="text-xs text-rose-600 flex items-center gap-1 mt-1">
      <i class="ti ti-alert-circle"></i>
      <span>{{ errorMessage() }}</span>
    </p>
  } @else if (hint()) {
    <p class="text-xs text-slate-500 mt-1">
      {{ hint() }}
    </p>
  }
</div>
