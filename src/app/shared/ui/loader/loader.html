@if (fullScreen() || type() === 'overlay') {
  <div class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-slate-900/40 backdrop-blur-xs animate-fadeIn">
    <div class="flex flex-col items-center justify-center p-6 rounded-2xl bg-white/90 shadow-2xl border border-slate-100">
      <!-- Spinner -->
      <div class="relative flex items-center justify-center">
        <svg
          class="animate-spin text-indigo-600"
          [class.w-6]="size() === 'sm'"
          [class.h-6]="size() === 'sm'"
          [class.w-8]="size() === 'md'"
          [class.h-8]="size() === 'md'"
          [class.w-12]="size() === 'lg'"
          [class.h-12]="size() === 'lg'"
          [class.w-16]="size() === 'xl'"
          [class.h-16]="size() === 'xl'"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >

          <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>

      @if (text()) {
        <p class="mt-3 text-sm font-semibold text-slate-800">
          {{ text() }}
        </p>
      }
    </div>
  </div>
} @else if (type() === 'skeleton') {
  <div class="animate-pulse space-y-3 w-full">
    <div class="h-4 bg-slate-200 rounded-lg w-3/4"></div>
    <div class="h-4 bg-slate-200 rounded-lg w-full"></div>
    <div class="h-4 bg-slate-200 rounded-lg w-5/6"></div>
  </div>
} @else if (type() === 'dots') {
  <div class="inline-flex items-center gap-1.5">
    <span class="w-2 h-2 rounded-full animate-bounce bg-indigo-600 [animation-delay:-0.3s]"></span>
    <span class="w-2 h-2 rounded-full animate-bounce bg-indigo-600 [animation-delay:-0.15s]"></span>
    <span class="w-2 h-2 rounded-full animate-bounce bg-indigo-600"></span>
    @if (text()) {
      <span class="ml-2 text-sm text-slate-600">{{ text() }}</span>
    }
  </div>
} @else {
  <!-- Standard inline spinner -->
  <div class="inline-flex items-center gap-2">
    <svg
      class="animate-spin"
      [class.w-4]="size() === 'sm'"
      [class.h-4]="size() === 'sm'"
      [class.w-6]="size() === 'md'"
      [class.h-6]="size() === 'md'"
      [class.w-8]="size() === 'lg'"
      [class.h-8]="size() === 'lg'"
      [class.w-12]="size() === 'xl'"
      [class.h-12]="size() === 'xl'"
      [class.text-indigo-600]="color() === 'primary'"
      [class.text-slate-600]="color() === 'secondary'"
      [class.text-white]="color() === 'white'"
      [class.text-slate-900]="color() === 'dark'"
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
    >
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    @if (text()) {
      <span class="text-sm font-medium text-slate-600">{{ text() }}</span>
    }
  </div>
}
