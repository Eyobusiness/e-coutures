<div class="space-y-1.5">
  @if (label()) {
    <label class="block text-sm font-medium text-slate-700">
      {{ label() }}
      @if (required()) {
        <span class="text-rose-500 ml-0.5">*</span>
      }
    </label>
  }

  <div class="relative" [class.z-30]="isOpen()">
    <!-- Trigger Button -->
    <button
      type="button"
      (click)="toggleOpen($event)"
      [disabled]="disabled() || isDisabled()"
      class="flex w-full items-center justify-between rounded-xl border bg-white px-3.5 py-2.5 text-left text-sm text-slate-900 shadow-xs focus:outline-none focus:ring-2 focus:ring-offset-0 disabled:bg-slate-50 disabled:text-slate-500 disabled:cursor-not-allowed transition-colors"
      [class.border-slate-300]="!errorMessage()"
      [class.focus:border-indigo-600]="!errorMessage()"
      [class.focus:ring-indigo-600/20]="!errorMessage()"
      [class.border-rose-500]="errorMessage()"
      [class.focus:border-rose-500]="errorMessage()"
    >
      <div class="flex items-center gap-2 truncate">
        @if (selectedOptionIcon()) {
          <i [class]="selectedOptionIcon() + ' text-slate-500 text-base'"></i>
        }
        <span [class.text-slate-400]="!selectedValue() && selectedValue() !== 0">
          {{ selectedOptionLabel() }}
        </span>
      </div>

      <i class="ti ti-chevron-down text-slate-400 text-base transition-transform duration-200" [class.rotate-180]="isOpen()"></i>
    </button>

    <!-- Dropdown Menu -->
    @if (isOpen()) {
      <div
        class="absolute left-0 right-0 z-[100] max-h-60 overflow-y-auto rounded-xl border border-slate-200 bg-white p-1.5 shadow-xl animate-scaleUp"
        [class.bottom-full]="openUpward()"
        [class.mb-1.5]="openUpward()"
        [class.top-full]="!openUpward()"
        [class.mt-1.5]="!openUpward()"
      >
        @if (searchable()) {
          <div class="p-1 mb-1 border-b border-slate-100">
            <input
              type="text"
              [value]="filterQuery()"
              (input)="onSearchInput($event)"
              placeholder="Chercher une option..."
              class="w-full rounded-lg bg-slate-50 px-3 py-1.5 text-xs text-slate-900 focus:outline-none focus:ring-1 focus:ring-indigo-500"
            />
          </div>
        }

        @for (option of filteredOptions(); track option.value) {
          <button
            type="button"
            (click)="selectOption(option, $event)"
            [disabled]="option.disabled"
            class="flex w-full items-center justify-between rounded-lg px-3 py-2 text-left text-sm transition-colors hover:bg-indigo-50/70 focus:outline-none disabled:opacity-40 disabled:cursor-not-allowed"
            [class.bg-indigo-50]="isSelected(option.value)"
            [class.text-indigo-700]="isSelected(option.value)"
            [class.font-semibold]="isSelected(option.value)"
            [class.text-slate-700]="!isSelected(option.value)"
          >
            <div class="flex items-center gap-2.5 truncate">
              @if (option.icon) {
                <i [class]="option.icon + ' text-base text-slate-400'"></i>
              }
              <div>
                <p class="truncate">{{ option.label }}</p>
                @if (option.description) {
                  <p class="text-xs text-slate-400 font-normal">{{ option.description }}</p>
                }
              </div>
            </div>

            @if (isSelected(option.value)) {
              <i class="ti ti-check text-indigo-600 text-base"></i>
            }
          </button>
        } @empty {
          <p class="p-3 text-center text-xs text-slate-400">Aucune option trouvée</p>
        }
      </div>
    }
  </div>

  @if (errorMessage()) {
    <p class="text-xs text-rose-600 flex items-center gap-1 mt-1">
      <i class="ti ti-alert-circle"></i>
      <span>{{ errorMessage() }}</span>
    </p>
  } @else if (hint()) {
    <p class="text-xs text-slate-500 mt-1">
      {{ hint() }}
    </p>
  }
</div>
