<div class="relative rounded-xl shadow-xs">
  <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
    <i class="ti ti-search text-lg"></i>
  </div>

  <input
    type="text"
    [value]="searchTerm()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    class="block w-full rounded-xl border border-slate-200/90 bg-white pl-10 pr-10 text-slate-900 placeholder:text-slate-400 focus:border-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-600/20 disabled:bg-slate-50 disabled:cursor-not-allowed transition-all"
    [class.py-1.5]="size() === 'sm'"
    [class.text-xs]="size() === 'sm'"
    [class.py-2.5]="size() === 'md'"
    [class.text-sm]="size() === 'md'"
    [class.py-3.5]="size() === 'lg'"
    [class.text-base]="size() === 'lg'"
  />

  @if (searchTerm()) {
    <button
      type="button"
      (click)="onClear()"
      class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-700 transition-colors"
      aria-label="Effacer la recherche"
    >
      <i class="ti ti-x text-lg"></i>
    </button>
  }
</div>
