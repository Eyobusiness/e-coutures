<div class="flex flex-col items-center justify-center p-8 md:p-12 text-center rounded-2xl border-2 border-dashed border-slate-200 bg-slate-50/50">
  <div class="flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-50 text-indigo-600 mb-4 shadow-sm">
    <i [class]="icon() + ' text-3xl'"></i>
  </div>

  <h3 class="text-lg font-semibold text-slate-900 mb-1">
    {{ title() }}
  </h3>

  @if (description()) {
    <p class="text-sm text-slate-500 max-w-sm leading-relaxed mb-6">
      {{ description() }}
    </p>
  }

  @if (actionLabel()) {
    <button
      type="button"
      (click)="onAction()"
      class="inline-flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all active:scale-95"
    >
      @if (actionIcon()) {
        <i [class]="actionIcon() + ' text-base'"></i>
      }
      <span>{{ actionLabel() }}</span>
    </button>
  }
</div>
