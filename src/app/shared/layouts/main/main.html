<div class="app-layout"
     [class.sidebar-collapsed]="layoutService.isSidebarCollapsed()"
     [class.mobile-sidebar-open]="layoutService.isMobileSidebarOpen()">

    <!-- Mobile sidebar backdrop overlay -->
    @if (layoutService.isMobileSidebarOpen()) {
        <div class="sidebar-backdrop" (click)="layoutService.closeMobileSidebar()"></div>
    }

    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <div class="app-wrapper">

        <!-- Header -->
        <app-header></app-header>

        <!-- Contenu -->
        <main class="app-content">
            <div class="fade-in-route">
                <router-outlet></router-outlet>
            </div>
        </main>

        <!-- Footer -->
        <app-footer></app-footer>

    </div>

</div>
